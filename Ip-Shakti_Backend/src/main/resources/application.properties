spring.config.import=optional:file:.env[.properties]
spring.application.name=Ip-Shakti_Backend
server.port=${PORT:8080}

spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-20b
spring.ai.openai.api-key=${GROQ_API_KEY:}

spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:qwen3.5:4b}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
# Enable Ollama embedding auto-configuration
spring.ai.model.embedding=ollama
# Select your embedding model
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}


spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

spring.jps.show-sql=true
spring.datasource.driver-class-name=org.postgresql.Driver

spring.main.allow-bean-definition-overriding=true

spring.sql.init.schema-locations=classpath:init/schema.sql
spring.sql.init.mode=always

# Run with --app.knowledge-base.ingest-on-startup=true to index the corpus.
# Relative paths are resolved from the backend working directory.
app.knowledge-base.corpus-path=${KNOWLEDGE_BASE_CORPUS_PATH:../Ayushakti/knowledge-base/corpus}
app.knowledge-base.ingest-on-startup=${INGEST_KNOWLEDGE_BASE:false}
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}